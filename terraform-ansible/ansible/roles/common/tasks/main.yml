---
- name: Створення домашньої директорії для користувача 'student'
  file:
    path: /home/student
    state: directory
    mode: '0755'

- name: Створення файлу з варіантом завдання
  copy:
    dest: /home/student/gradebook
    content: "23"
    mode: '0644'

- name: Створення користувача 'teacher' із паролем за замовчуванням
  user:
    name: teacher
    password: "{{ '12345678' | password_hash('sha512') }}"
    groups: sudo
    append: yes
    shell: /bin/bash