name: Node.js CI/CP (Lab3)

on:
  push:
    branches: [ "main" ]
    tags: [ '*' ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  packages: write

jobs:
  linting:
    name: Static Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24' 
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint (JS/TS linter)
        run: npm run lint

      - name: Run Hadolint (Dockerfile linter)
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile

      - name: Run Shellcheck (Shell scripts linter)
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: './scripts'
        env:
          SHELLCHECK_OPTS: -x

  testing:
    name: Automated Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Tests
        run: npm run test

      - name: Upload Coverage Artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

  build-and-push:
    name: Build & Push Docker Image
    needs: [linting, testing]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata (Tags)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=sha-${{ github.sha }},enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=stable,enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=ref,event=tag

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
  
  deploy:
    name: Deploy to Target Node
    needs: [build-and-push]
    
    if: startsWith(github.ref, 'refs/tags/')
    
    runs-on: self-hosted
    
    steps:
      - name: Deploy via SSH
        env:
          TARGET_IP: ${{ secrets.TARGET_IP }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          GHCR_PAT: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')

          ssh -o StrictHostKeyChecking=no vagrant@$TARGET_IP << EOF
            echo "POSTGRES_USER=$DB_USER" > /tmp/.env
            echo "POSTGRES_PASSWORD=$DB_PASSWORD" >> /tmp/.env
            echo "POSTGRES_DB=app_db" >> /tmp/.env
            echo "DATABASE_URL=postgres://$DB_USER:$DB_PASSWORD@postgres-db:5432/app_db" >> /tmp/.env
            echo "APP_IMAGE=ghcr.io/$REPO_LOWER:stable" >> /tmp/.env
            sudo mv /tmp/.env /etc/app-config/.env
            
            sudo systemctl start postgres-db
            
            docker pull ghcr.io/$REPO_LOWER:stable
            
            sudo systemctl restart nodejs-app
          EOF

      - name: Verify Deployment
        env:
          TARGET_IP: ${{ secrets.TARGET_IP }}
        run: |
          sleep 5
          
          HTTP_STATUS=$(curl -o /dev/null -s -w "%{http_code}\n" http://$TARGET_IP)
          
          # Убираем бэкслеш перед проверкой переменной
          if [ "$HTTP_STATUS" -eq 200 ]; then
            echo "✅ Verification successful! Received HTTP status code: $HTTP_STATUS"
          else
            echo "❌ Verification failed! Received status from Nginx: $HTTP_STATUS"
            exit 1
          fi
